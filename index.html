<h1>ClearWidget</h1>
<p class="muted">macOS 데스크톱에 놓는 개인용 위젯 앱</p>
<p>ClearWidget은 시계, 캘린더, 날씨, 타이머, 메모 같은 위젯을 바탕화면의 창 뒤에 놓아 두는 macOS 앱입니다. 한 사람이 자기 Mac에서 쓰려고 만든 개인 프로젝트이며, 별도의 서버나 계정 없이 사용자의 Mac 안에서만 동작합니다.</p>
<h2>Google 계정 연결에 대해</h2>
<p>사용자가 원할 때만 Google 캘린더를 연결합니다. 연결하면 앱이 사용자의 일정을 <strong>읽기 전용</strong>으로 가져와 위젯에 보여 줍니다. 자세한 내용은 <a href="privacy.html">개인정보처리방침</a>을 보세요.</p>
